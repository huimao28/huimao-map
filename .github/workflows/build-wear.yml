name: Build Wear OS Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*-wear' ]

permissions:
  contents: write

jobs:
  build-wear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Restore fixed release keystore
        env:
          HUIMAO_KEYSTORE_BASE64: ${{ secrets.HUIMAO_KEYSTORE_BASE64 }}
        run: |
          test -n "$HUIMAO_KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$HUIMAO_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      - name: Build Wear OS APK and AAB
        env:
          HUIMAO_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          HUIMAO_KEYSTORE_PASSWORD: ${{ secrets.HUIMAO_KEYSTORE_PASSWORD }}
          HUIMAO_KEY_PASSWORD: ${{ secrets.HUIMAO_KEYSTORE_PASSWORD }}
          HUIMAO_KEY_ALIAS: release
        run: |
          VERSION=$(grep -m1 'versionName =' wear/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          gradle :wear:assembleRelease :wear:bundleRelease --stacktrace
          mkdir -p release-files
          cp wear/build/outputs/apk/release/wear-release.apk release-files/HuimaoMap_Wear_${VERSION}.apk
          cp wear/build/outputs/bundle/release/wear-release.aab release-files/HuimaoMap_Wear_${VERSION}.aab

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HuimaoMap-Wear-OS
          path: release-files/*

      - name: Validate release notes
        run: |
          test -s RELEASE_NOTES.md
          ! grep -q '待填写' RELEASE_NOTES.md
          grep -q '## 修复内容' RELEASE_NOTES.md
          grep -q '## 已知问题' RELEASE_NOTES.md

      - name: Prepare tagged release files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%-wear}"
          cp release-files/HuimaoMap_Wear_${VERSION}.apk "HuimaoMap_Wear_${VERSION}.apk"
          cp release-files/HuimaoMap_Wear_${VERSION}.aab "HuimaoMap_Wear_${VERSION}.aab"

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          name: Huimao Map Wear OS ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          append_body: false
          generate_release_notes: false
          files: |
            HuimaoMap_Wear_*.apk
            HuimaoMap_Wear_*.aab
